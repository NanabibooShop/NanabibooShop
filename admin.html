<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Quản lý NanabibooShop</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23211A31'/%3E%3Cpath d='M32 18c0-5 7-5 7 0 0 3-7 4-7 8L12 40h40L32 26' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
  <header class="topbar">
    <div class="topbar__in">
      <a class="brand" href="index.html" title="Mở trang khách">
        <svg class="brand__hanger" viewBox="0 0 48 32" aria-hidden="true"><path d="M24 9c0-4 6-4 6 0 0 3-6 3.5-6 7L4 28h40L24 16" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="brand__name">Quản lý shop</span>
      </a>
      <div class="adm-save">
        <span class="dirty" id="dirty" hidden>Chưa lưu</span>
        <button class="btn btn--primary" type="button" id="saveBtn">Lưu</button>
      </div>
    </div>
  </header>

  <main class="wrap adm" id="adm" data-view="list">
    <div class="banner" id="draftBanner" hidden>
      <span id="draftText">Có bản nháp chưa lưu.</span>
      <span class="banner__act">
        <button class="btn btn--ghost btn--sm" type="button" id="useDraft">Dùng bản nháp</button>
        <button class="btn btn--ghost btn--sm" type="button" id="dropDraft">Bỏ</button>
      </span>
    </div>

    <nav class="tabs" role="tablist" aria-label="Mục quản lý">
      <button class="tab" role="tab" id="tabItems" aria-selected="true" type="button">Bộ đồ</button>
      <button class="tab" role="tab" id="tabShop" aria-selected="false" type="button">Thông tin shop</button>
    </nav>

    <!-- Danh sách bộ đồ + form sửa -->
    <section class="adm-items" id="paneItems">
      <aside class="adm-list">
        <div class="adm-list__head">
          <label class="sr-only" for="listQ">Tìm</label>
          <input id="listQ" type="search" placeholder="Tìm bộ đồ…" autocomplete="off">
          <button class="btn btn--primary btn--sm" type="button" id="addBtn">+ Thêm đồ</button>
        </div>
        <div class="adm-list__body" id="list"></div>
      </aside>

      <section class="adm-edit" id="editor" aria-live="polite"></section>
    </section>

    <!-- Thông tin shop -->
    <section class="panel adm-shop" id="paneShop" hidden>
      <h2>Thông tin shop</h2>
      <div class="fields2">
        <div class="field"><label for="sName">Tên shop</label><input id="sName" data-shop="name"></div>
        <div class="field"><label for="sAddr">Khu vực / địa chỉ</label><input id="sAddr" data-shop="address"></div>
      </div>
      <div class="field"><label for="sTag">Câu giới thiệu ngắn</label><input id="sTag" data-shop="tagline"></div>
      <div class="field"><label for="sMsg">Link Messenger (khách gửi tin chốt thuê vào đây)</label><input id="sMsg" data-shop="messenger" placeholder="https://m.me/ten-trang-cua-ban"></div>
      <p class="hint">Mở trang Facebook của shop → phần tên người dùng (username). Link Messenger là <b>https://m.me/</b> + username đó.</p>
      <div class="fields2">
        <div class="field"><label for="sFb">Link trang Facebook</label><input id="sFb" data-shop="facebook"></div>
        <div class="field"><label for="sPhone">Số điện thoại (để trống nếu không muốn hiện)</label><input id="sPhone" data-shop="phone"></div>
      </div>
      <div class="field"><label for="sClean">Số ngày giặt ủi sau mỗi lượt thuê (ghi chú)</label><input id="sClean" data-shop="cleaningDays" type="number" min="0" max="7" inputmode="numeric"></div>
      <p class="hint">Chỉ dùng để tô màu vàng trên lịch nhỏ trong admin, giúp bạn nhớ ngày giặt ủi. Không ảnh hưởng tới lịch khách chọn.</p>
      <div class="field"><label for="sHow">Hướng dẫn cách thuê (mỗi dòng là một bước)</label><textarea id="sHow" data-shop="howTo" rows="4"></textarea></div>
      <div class="field"><label for="sPolicy">Luật thuê của shop — ghim ở đầu trang chủ (mỗi dòng là một điều)</label><textarea id="sPolicy" data-shop="policy" rows="7" placeholder="Cọc giữ đồ trước khi nhận.&#10;Trả đồ đúng hẹn; trễ tính thêm 1 ngày thuê.&#10;…"></textarea></div>
    </section>
  </main>

  <!-- Hộp lưu -->
  <dialog class="sheet" id="saveSheet" aria-labelledby="saveTitle">
    <div class="sheet__grab" aria-hidden="true"></div>
    <div class="sheet__head">
      <h2 id="saveTitle">Lưu thay đổi</h2>
      <button class="icon-btn" type="button" data-close aria-label="Đóng"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </div>
    <div id="saveBody"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
